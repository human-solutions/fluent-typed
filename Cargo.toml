[package]
name = "fluent-typed"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Type-safe access to Fluent localization messages"
keywords = ["fluent", "internationalization", "localization"]
categories = [
    "internationalization",
    "localization",
    "development-tools::build-utils",
]
license = "MIT"
repository = "https://github.com/human-solutions/fluent-typed"
# Keep the published crate lean: drop editor config, AI-assistant notes, and
# the 89-file snapshot test corpus under src/tests (noise to anyone reading the
# source). The small tests/ harness is kept so cargo's auto-discovered test
# targets still resolve at publish time instead of warning that they're missing.
exclude = ["/.vscode", "/CLAUDE.md", "/src/tests"]

[lib]
doctest = false

[features]
# When developing, make sure that the default is un-commented.
default = ["build", "langneg"]
build = []
langneg = ["dep:icu_locale_core"]
# Re-exports internal build-pipeline pieces (parse/analyze/lint/generate) for
# the benchmark suite. Non-default and not part of the stable public API;
# enable it only when running `cargo bench`.
bench-internals = ["build"]

[dependencies]
fluent-syntax = "0.12"
fluent-bundle = "0.16"
unic-langid = "0.9"
icu_locale_core = { version = "2.1", optional = true, features = ["alloc"] }

[dev-dependencies]
insta = "1.46"
unic-langid = { version = "0.9", features = ["macros"] }
criterion = "0.8"

[[bench]]
name = "build_pipeline"
harness = false
required-features = ["bench-internals"]

# Document exactly the public feature surface on docs.rs. `bench-internals` is
# deliberately excluded — it is not part of the stable public API.
[package.metadata.docs.rs]
features = ["build", "langneg"]
